name: Deploy DOC-FULL-NR FINAL CLEAN V1.4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doc-full-nr-final-clean-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Release gate
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          test -f site/BUILD.json
          test -f site/js/app.js
          test ! -f site/app.js
          test -d site/js/pages
          grep -q 'CLEAN-V1.4-LEARNING-GROUP-INTEGRITY-SEM2-2569' site/BUILD.json
          find site/js -name '*.js' -print0 | xargs -0 -n1 node --check
          ! grep -R "clean_attendance" site
          ! grep -R "clean_my_identity_qr" site
          ! grep -R "clean_public_profile_by_qr" site
          ! grep -R "clean-qr-render" site
          ! grep -R "serviceWorker.register" site
          grep -R "clean_mobile_copy_submit" site/js/mobile.js
          grep -R "clean_system_acceptance" site/js/pages/diagnostics.js
          grep -R "clean_teaching_unit_bundle" site/js/pages/teaching.js
          grep -R "clean_teaching_digital_preview" site/js/pages/teaching.js
          grep -R "clean_teaching_open_digital_worksheet" site/js/pages/teaching.js
          grep -R "clean_admin_approve_student_v4" site/js/pages/users.js
          grep -R "clean_admin_assign_learning_group" site/js/pages/users.js site/js/pages/groups.js
          grep -R "clean_admin_set_teacher_assignment_v2" site/js/pages/assignments.js
          grep -R "clean_gradebook_group" site/js/pages/gradebook.js
          grep -R "clean_staff_work_queue_summary" site/js/pages/dashboard.js
          grep -R "clean_student_profile_detail" site/js
          grep -R "registrationVideo" site/js/ui.js
          grep -R "clean-registration-photo-url" site/js
          grep -R "clean_worksheet_publish_preview" site/js/pages/worksheets.js
          echo 'FINAL CLEAN V1.4 release gate PASS'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live build marker
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsSL --max-time 10 "${PAGE_URL}BUILD.json?ts=$(date +%s)" | grep -q 'CLEAN-V1.4-LEARNING-GROUP-INTEGRITY-SEM2-2569'; then
              echo 'LIVE BUILD VERIFIED'
              exit 0
            fi
            echo "Waiting for live marker... $i/45"
            sleep 10
          done
          echo 'Live build marker was not detected.' >&2
          exit 1
